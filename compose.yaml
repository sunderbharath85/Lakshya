# Local use:  docker compose up -d --build   →   http://localhost:4777 (no password)
#
# Only this machine can reach it (bound to 127.0.0.1), like `bun dev`. To run it anywhere others can
# reach, use compose.server.yaml, which puts Caddy with basic auth in front. See README.
name: lakshya

services:
  lakshya:
    build: .
    image: lakshya:latest
    init: true # reaps the processes agents leave behind
    restart: unless-stopped
    environment:
      AOS_PUBLIC_URL: ${LAKSHYA_PUBLIC_URL:-http://localhost:${LAKSHYA_PORT:-4777}}
      # Agent credentials. Any that are empty can be set up later by logging in inside the container.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-}
    volumes:
      - lakshya-data:/data # database, per-session files
      - lakshya-home:/home/bun # CLI logins and settings (~/.claude, ~/.codex, opencode)
      - ${LAKSHYA_WORKSPACE:-./workspace}:/workspace # the code the agents write, one folder per team
    ports:
      # No password on this port, so it stays on loopback. Don't change 127.0.0.1: use compose.server.yaml.
      - "127.0.0.1:${LAKSHYA_PORT:-4777}:4777"

volumes:
  lakshya-data:
  lakshya-home:
